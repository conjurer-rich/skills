[project]
name = "ticket-desk"
version = "0.1.0"
description = "Backend for the support-desk app."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "basedpyright>=1.20",
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
cache-dir = ".uv-cache"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
