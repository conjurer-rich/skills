name: Skill evals

# The promptfoo skill evaluations spend real tokens and sample a
# non-deterministic decision, so they do not run on every push. They run:
#   - on demand (workflow_dispatch: choose a suite, model and repeat count);
#   - weekly, as a drift check;
#   - on a pull request that changes a skill or the harness AND carries the
#     `run-evals` label.
# The offline guards in test/run.sh (suite wiring, routing cases) run in ci.yml
# on every push.
#
# Authentication is Anthropic workload identity federation, not an API key:
# Claude Code exchanges the job's GitHub OIDC token for a short-lived access
# token, using the ANTHROPIC_* variables below. The federation rule accepts
# runs on main only, so a `run-evals` pull request does not authenticate until
# the rule allows its subject.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "routing, or a quality suite: tdd | hexagonal | ddd | all"
        default: all
        type: string
      model:
        description: "Claude Agent SDK model alias"
        default: sonnet
        type: string
      repeat:
        description: "promptfoo --repeat"
        default: "1"
        type: string
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "skills/**"
      - "shelf/skills/**"
      - "evals/skills/**"

permissions:
  id-token: write
  contents: read

jobs:
  evals:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01R7d3WtTugiDouWLQmkkVyi
      ANTHROPIC_ORGANIZATION_ID: e2fc6ca7-ed9b-47bd-8517-229213660087
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01D6mZyodqT7Bdjwbgp4ve1D
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Us1Z4NxNPsoyFQNLcfcdWa
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      SKILL_EVAL_MODEL: ${{ inputs.model || 'sonnet' }}
      SUITE: ${{ inputs.suite || 'all' }}
      REPEAT: ${{ inputs.repeat || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: evals/skills/pnpm-lock.yaml
      - name: Install the harness
        working-directory: evals/skills
        run: pnpm install --frozen-lockfile
      # A GitHub OIDC token lasts about five minutes and the suites run for
      # much longer, so a background loop keeps the file fresh. Claude Code
      # re-reads it on every exchange.
      - name: Keep the GitHub identity token fresh
        run: |
          ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/anthropic-identity-token"
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$ANTHROPIC_IDENTITY_TOKEN_FILE" >> "$GITHUB_ENV"
          fetch() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch
          (while sleep 180; do fetch || echo "identity token refresh failed" >&2; done) \
            > "$RUNNER_TEMP/identity-token-refresh.log" 2>&1 &
      - name: Routing suite
        if: env.SUITE == 'all' || env.SUITE == 'routing'
        working-directory: evals/skills
        run: ./run.sh --no-progress-bar --repeat "$REPEAT" | tee results/routing-report.txt
      - name: Quality suites
        if: env.SUITE != 'routing'
        working-directory: evals/skills
        run: |
          suites="$SUITE"
          if [ "$suites" = "all" ]; then suites="tdd hexagonal ddd"; fi
          status=0
          for suite in $suites; do
            ./run-quality.sh "$suite" --no-progress-bar --repeat "$REPEAT" | tee "results/$suite-report.txt" || status=1
          done
          exit $status
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-results-${{ github.run_id }}
          path: |
            evals/skills/results/*.json
            evals/skills/results/*-report.txt
            evals/skills/results/**/*.diff
          if-no-files-found: warn
