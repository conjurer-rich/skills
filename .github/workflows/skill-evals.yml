name: Skill evals

# The promptfoo skill evaluations spend real tokens and sample a
# non-deterministic decision, so they do not run on every push. They run:
#   - on demand (workflow_dispatch: choose a suite, model and repeat count);
#   - weekly, as a drift check;
#   - on a pull request that changes a skill or the harness AND carries the
#     `run-evals` label.
# The offline guards in test/run.sh (suite wiring, routing cases) run in ci.yml
# on every push.
#
# Authentication is Anthropic workload identity federation, not an API key.
# Claude Code runs evals/skills/ci-anthropic-token.sh as its credential helper;
# each call exchanges a fresh GitHub OIDC token for a short-lived access token.
# The federation rule accepts this workflow on main only, so a `run-evals` pull
# request does not authenticate until the rule allows it.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "routing, or a quality suite: tdd | hexagonal | ddd | all"
        default: all
        type: string
      model:
        description: "Claude Agent SDK model alias"
        default: sonnet
        type: string
      repeat:
        description: "promptfoo --repeat"
        default: "1"
        type: string
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "skills/**"
      - "shelf/skills/**"
      - "evals/skills/**"

permissions:
  id-token: write
  contents: read

jobs:
  evals:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WIF_FEDERATION_RULE_ID: fdrl_01R7d3WtTugiDouWLQmkkVyi
      WIF_ORGANIZATION_ID: e2fc6ca7-ed9b-47bd-8517-229213660087
      WIF_SERVICE_ACCOUNT_ID: svac_01D6mZyodqT7Bdjwbgp4ve1D
      WIF_WORKSPACE_ID: wrkspc_01Us1Z4NxNPsoyFQNLcfcdWa
      # Refresh well inside the access token's ten-minute life.
      CLAUDE_CODE_API_KEY_HELPER_TTL_MS: "240000"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      SKILL_EVAL_MODEL: ${{ inputs.model || 'sonnet' }}
      SUITE: ${{ inputs.suite || 'all' }}
      REPEAT: ${{ inputs.repeat || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: evals/skills/pnpm-lock.yaml
      - name: Install the harness
        working-directory: evals/skills
        run: pnpm install --frozen-lockfile
      # Managed settings load whatever setting sources the harness asks for.
      - name: Configure the credential helper
        run: |
          sudo mkdir -p /etc/claude-code
          jq -n --arg helper "$GITHUB_WORKSPACE/evals/skills/ci-anthropic-token.sh" \
            '{apiKeyHelper: $helper}' | sudo tee /etc/claude-code/managed-settings.json
      # Fail in seconds, not after fifty cases: the helper must mint a token,
      # and the API must accept it in the two headers Claude Code sends.
      - name: Check the credential helper
        run: |
          token="$(evals/skills/ci-anthropic-token.sh)"
          echo "::add-mask::$token"
          code="$(curl -sS -o "$RUNNER_TEMP/models.json" -w '%{http_code}' \
            https://api.anthropic.com/v1/models \
            -H "anthropic-version: 2023-06-01" \
            -H "x-api-key: $token" -H "authorization: Bearer $token")"
          echo "GET /v1/models with both headers: HTTP $code"
          if [ "$code" != 200 ]; then
            jq -c '.error // .' "$RUNNER_TEMP/models.json" || true
            exit 1
          fi
      - name: Routing suite
        if: env.SUITE == 'all' || env.SUITE == 'routing'
        working-directory: evals/skills
        run: ./run.sh --no-progress-bar --repeat "$REPEAT" | tee results/routing-report.txt
      - name: Quality suites
        if: env.SUITE != 'routing'
        working-directory: evals/skills
        run: |
          suites="$SUITE"
          if [ "$suites" = "all" ]; then suites="tdd hexagonal ddd"; fi
          status=0
          for suite in $suites; do
            ./run-quality.sh "$suite" --no-progress-bar --repeat "$REPEAT" | tee "results/$suite-report.txt" || status=1
          done
          exit $status
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-results-${{ github.run_id }}
          path: |
            evals/skills/results/*.json
            evals/skills/results/*-report.txt
            evals/skills/results/**/*.diff
          if-no-files-found: warn
