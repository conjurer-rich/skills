name: Delegate fire

# A reusable workflow: a project that delegates GitHub issues calls it on a
# cron to restart /loop /delegate chains that ended. It runs the
# delegating-github-issues skill's scripts/delegate-fire, which reads the
# delegation state with the caller's GITHUB_TOKEN (no model, no cost) and,
# only when there is work and a free lease slot, fires the scheduled task
# whose prompt is /delegate loop. With the reserve-token secret it fills
# every free slot in one run, reserving each slot and issue first.
#
# A caller may also run it on issue and pull request events. With
# skip-own-events on, events the delegator's own login caused are skipped,
# except a closed PR, which frees a slot whoever closed it. Leave it off when
# the delegator posts as the human, as it does through the human's gh auth:
# the filter would then skip the human's own labels, Ready clicks and reviews.
#
# For a team, where each teammate runs the delegator under their own login
# with their own scheduled task, set a `roster` in the project's
# .claude/delegation.md and pass the `triggers` secret: one JSON object
# mapping each login to {url, token, reserve_token?}. Each event then wakes
# exactly one teammate's trigger, routed from the event context below. The
# gate assigns an unassigned issue to its owner before it fires, with the
# workflow token, so a team caller must grant `issues: write`; this job
# declares no permissions of its own and takes the caller's.
#
# With `rereview` on, a team caller that also listens for pull_request
# review_requested wakes the requested reviewer's review-requests trigger
# (`review_url` in their triggers entry) for a re-review of a delegated PR.
#
# Setup and a caller example:
# skills/delivery/delegating-github-issues/references/delegate-fire.md

on:
  workflow_call:
    inputs:
      craft-ref:
        description: The conjurer-rich/skills tag or commit whose delegate-fire runs; use the same ref as the `uses:` line
        type: string
        required: true
      delegator-login:
        description: The GitHub login the delegator posts as; its markers and claims are the only ones that count. Default, the repository owner
        type: string
        default: ""
      skip-own-events:
        description: Skip issue and PR events the delegator's login caused, except a closed PR. Only for a delegator with a login of its own, never one that posts as the human
        type: boolean
        default: false
      force:
        description: Fire even when the gate finds nothing to do
        type: boolean
        default: false
      dry-run:
        description: Decide and report, but never fire
        type: boolean
        default: false
    secrets:
      fire-url:
        description: The scheduled task's API trigger URL (a single-login project)
        required: false
      fire-token:
        description: The trigger's token
        required: false
      triggers:
        description: 'With a roster, one JSON object mapping each roster login to {"url", "token", "reserve_token"?}, its own scheduled task trigger and optional reserve token. Replaces fire-url, fire-token and reserve-token'
        required: false
      reserve-token:
        description: A token of the delegator's login with Issues read and write and Pull requests read. When set, one run fills every free lease slot, reserving each one first; without it a run fires at most once. Only the reservations use it
        required: false
    outputs:
      fired:
        description: true when a chain was started
        value: ${{ jobs.fire.outputs.fired }}

jobs:
  fire:
    # With skip-own-events, skip an event the delegator's own login caused:
    # it labels issues and opens and readies PRs on every pass. A closed PR
    # still runs, since a merge frees a slot whoever merged it.
    if: >-
      !inputs.skip-own-events ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      github.event.sender.login != (inputs.delegator-login || github.repository_owner)
    runs-on: ubuntu-latest
    # No permissions block: a called workflow can only narrow the caller's
    # grant, and a single-login caller grants issues: read, which a job asking
    # for issues: write would fail on. The caller's block is the bound: read
    # access for one login; issues: write too with a roster, to assign.
    concurrency:
      group: delegate-fire-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      fired: ${{ steps.fire.outputs.fired }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the craft scripts
        uses: actions/checkout@v4
        with:
          repository: conjurer-rich/skills
          ref: ${{ inputs.craft-ref }}
          path: .delegate-fire-craft
          sparse-checkout: skills/delivery/delegating-github-issues/scripts

      - name: Fire the delegator when it has work
        id: fire
        env:
          # Reads use the workflow token; only the reservations use the
          # reserve token, which writes as the delegator's login.
          GH_TOKEN: ${{ github.token }}
          DELEGATE_FIRE_RESERVE_TOKEN: ${{ secrets.reserve-token }}
          RESERVE: ${{ secrets.reserve-token != '' }}
          # The Actions token is no user, so the gate cannot ask GitHub whose
          # markers are the delegator's own.
          DELEGATE_STATUS_LOGIN: ${{ inputs.delegator-login || github.repository_owner }}
          DELEGATE_FIRE_URL: ${{ secrets.fire-url }}
          DELEGATE_FIRE_TOKEN: ${{ secrets.fire-token }}
          DELEGATE_FIRE_TRIGGERS: ${{ secrets.triggers }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry-run }}
          # Team routing reads the event itself, never inputs from the caller.
          # The script ignores these without a roster.
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
        run: |
          args=(--event "$EVENT" --action "$ACTION" --number "$NUMBER" --label "$LABEL"
            --sender "$SENDER" --author "$AUTHOR" --head "$HEAD_REF" --reviewer "$REVIEWER")
          [ "$RESERVE" = true ] && args+=(--reserve)
          [ "$FORCE" = true ] && args+=(--force)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          .delegate-fire-craft/skills/delivery/delegating-github-issues/scripts/delegate-fire ${args[@]+"${args[@]}"}
